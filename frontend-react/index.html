<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover  → layout vào cả vùng notch/safe-area trên iOS
      maximum-scale=5.0   → cho phép user zoom tới 5x (scale được)
      Không dùng user-scalable=no vì sẽ block pinch-to-zoom
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#212121" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AI Data Analyst</title>
    <meta name="description" content="Trợ lý phân tích dữ liệu Olist E-Commerce bằng ngôn ngữ tự nhiên" />
  </head>
